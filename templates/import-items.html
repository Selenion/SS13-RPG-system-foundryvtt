<form class="ss13-import-items">
  <section class="import-summary">
    <p><strong>Total bundled items:</strong> {{totalCount}}</p>
    <p><strong>Already imported:</strong> {{importedCount}}</p>
    <p><strong>Missing from world:</strong> {{missingCount}}</p>
  </section>
  <div class="import-actions">
    <button type="button" data-action="import">
      <i class="fas fa-download"></i> Import Missing
    </button>
    <button type="button" data-action="update">
      <i class="fas fa-sync-alt"></i> Update Existing
    </button>
  </div>
</form>
