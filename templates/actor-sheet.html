<form class="ss13-sheet">
  <header>
    <h1><input name="name" type="text" value="{{actor.name}}" placeholder="Character Name"/></h1>
    <div class="stats">
      <div class="resources">
        <label>HP: <input name="system.resources.hp.value" type="number" value="{{system.resources.hp.value}}"/></label>
        <label>Stress: <input name="system.resources.stress.value" type="number" value="{{system.resources.stress.value}}"/></label>
      </div>
      <div class="attributes">
        {{#each system.attributes as |attr key|}}
        <div class="attr">
          <label>{{attr.label}}</label>
          <input name="system.attributes.{{key}}.value" type="number" value="{{attr.value}}"/>
        </div>
        {{/each}}
      </div>
    </div>
  </header>
  <nav class="sheet-tabs tabs" data-group="main">
    <a class="item" data-tab="stats">Stats</a>
    <a class="item" data-tab="inventory">Inventory</a>
  </nav>
  <section class="sheet-body">
    <div class="tab" data-group="main" data-tab="stats">
      <section class="saves">
        <h3>Saves</h3>
        {{#each system.saves as |save key|}}
        <button type="button" class="save-roll" data-save="{{key}}">{{save.label}}: {{save.value}}</button>
        {{/each}}
      </section>
      <section class="skills">
        <h3>Skills</h3>
        <div class="profession">
          <label>Profession</label>
          <select class="profession-select" name="system.profession.id">
            {{#each professionConfig.professionOptions as |profession|}}
            <option value="{{profession.id}}" {{#if profession.selected}}selected{{/if}}>{{profession.label}}</option>
            {{/each}}
          </select>
        </div>
        {{#each system.skills as |skill key|}}
        <div class="skill-row">
          <input class="skill-rank-select" data-skill="{{key}}" type="number" min="0" max="3" value="{{skill.rank}}"/>
          <button type="button" class="skill-roll" data-skill="{{key}}" data-actor="{{actor._id}}">{{skill.label}}: {{skill.target}}</button>
        </div>
        {{/each}}
      </section>
    </div>
    <div class="tab" data-group="main" data-tab="inventory">
      <section class="inventory">
        <h3>Equipment Slots</h3>
        <div class="slot-grid">
          {{#each inventorySlots as |slot|}}
          <div class="slot-card {{slot.key}}">
            <img class="slot-icon" src="{{slot.icon}}" alt="{{slot.key}}"/>
            <label>{{slot.key}}</label>
            <span>{{slot.itemId}}</span>
          </div>
          {{/each}}
        </div>
      </section>
    </div>
  </section>
</form>
